<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bon estiu · Pronto</title>
<style>
  :root{
    --bg:#190a24; --card:#33134a; --card2:#3d1659; --accent:#ff2e88; --accent2:#9b62ff;
    --gold:#ffd23f; --ink:#fff4fb; --muted:#cda9e6; --line:#5a2b80;
    --display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Quicksand", system-ui, sans-serif;
    --body: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:
      radial-gradient(900px 520px at 18% -8%, rgba(255,46,136,.30), transparent 60%),
      radial-gradient(900px 520px at 86% -4%, rgba(155,98,255,.30), transparent 60%),
      radial-gradient(1100px 900px at 50% 120%, rgba(255,210,63,.12), transparent 55%),
      #190a24;
    color:var(--ink);font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:520px;text-align:center;background:linear-gradient(165deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:28px;padding:36px 28px;box-shadow:0 18px 44px rgba(0,0,0,.45)}
  .ic{font-size:64px}
  h1{font-family:var(--display);font-size:30px;margin:10px 0 6px}
  p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 22px}
  a.btn{display:inline-block;font-family:var(--display);font-weight:800;font-size:18px;text-decoration:none;
    color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;padding:14px 24px;
    box-shadow:0 8px 20px rgba(255,46,136,.4)}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">☀️🚧</div>
    <h1>Bon estiu</h1>
    <p>Repaso de verano (Matemáticas · Cálculo · Lengua).<br>Todavía en construcción — ¡pronto!</p>
    <a class="btn" href="index.html">‹ Inicio</a>
  </div>
</body>
</html>
