        <!-- Шия (з'єднання ручки з тілом) -->
        <path d="M 40 18 L 38 36 L 62 36 L 60 18 Z" fill="#1f2230"/>
        <rect x="38" y="32" width="24" height="6" rx="2" fill="#2a2e3c"/>
        <!-- Тіло гирки -->
        <ellipse cx="50" cy="76" rx="42" ry="40" fill="currentColor" stroke="#15082a" stroke-width="3"/>
        <!-- Великий блік (металевий полиск) -->
        <ellipse cx="34" cy="58" rx="14" ry="9" fill="#fff" opacity="0.42"/>
        <!-- Малий нижній блік -->
        <ellipse cx="64" cy="100" rx="10" ry="3" fill="#fff" opacity="0.2"/>
        <!-- Темне відтінення внизу -->
        <ellipse cx="50" cy="100" rx="36" ry="10" fill="#000" opacity="0.2"/>
      </symbol>

      <!-- Меч-гокком -->
      <symbol id="sword" viewBox="0 0 200 40">
        <rect x="20" y="16" width="140" height="8" fill="url(#bladegrad)" stroke="#888" stroke-width="0.5"/>
        <polygon points="160,12 180,20 160,28" fill="#e8e8ff" stroke="#666" stroke-width="0.5"/>
        <rect x="10" y="14" width="14" height="12" fill="#ffd700" stroke="#7a5a10"/>
        <rect x="2" y="17" width="10" height="6" fill="#7a3018"/>
      </symbol>

      <linearGradient id="bladegrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.5" stop-color="#fff8c8"/>
        <stop offset="1" stop-color="#d4a830"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Декоративний фон з персонажами HUNTR/X та демонами -->
  <div class="bg-characters" aria-hidden="true">
    <svg class="bg-char bg-rumi  bg-pos-1" viewBox="0 0 100 120"><use href="#hero-rumi"/></svg>
    <svg class="bg-char bg-demon bg-pos-2" viewBox="0 0 100 120"><use href="#demon"/></svg>
    <svg class="bg-char bg-mira  bg-pos-3" viewBox="0 0 100 120"><use href="#hero-mira"/></svg>
    <svg class="bg-char bg-demon bg-pos-4" viewBox="0 0 100 120"><use href="#demon"/></svg>
    <svg class="bg-char bg-zoey  bg-pos-5" viewBox="0 0 100 120"><use href="#hero-zoey"/></svg>
    <svg class="bg-char bg-demon bg-pos-6" viewBox="0 0 100 120"><use href="#demon"/></svg>
    <!-- Сяючий хонмун-символ -->
    <div class="honmoon-bg honmoon-pos-1">✦</div>
    <div class="honmoon-bg honmoon-pos-2">✧</div>
    <div class="honmoon-bg honmoon-pos-3">★</div>
    <div class="honmoon-bg honmoon-pos-4">✦</div>
  </div>

  <div class="app">
    <header>
      <button class="settings-btn challenge-btn" id="challengeBtn" title="Challenge" aria-label="Challenge">🏆</button>
      <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙️</button>
      <h1 id="appTitle">🎤 HUNTR/X: Entrenador de euros 🗡️</h1>
      <div class="goals-bar" id="goalsBar" hidden></div>
      <div class="player-chip" id="playerChip" hidden>
        <span class="player-avatar" id="playerAvatar">⭐</span>
        <span class="player-name" id="playerName"></span>
        <span class="player-diff" id="playerDiff"></span>
      </div>
      <div class="stats">
        <div class="stat"><span id="lblScore">💜 Демонів знищено:</span> <span id="score">0</span></div>
        <div class="stat"><span id="lblStreak">🔥 Серія:</span> <span id="streak">0</span></div>
        <div class="stat"><span id="lblRound">🎯 Раунд:</span> <span id="round">1</span></div>
      </div>
    </header>

    <main id="game">
      <div class="task-card" id="taskCard">
        <div class="task-text" id="taskText">Завантаження...</div>
        <div class="task-area" id="taskArea"></div>
        <div class="controls" id="controls"></div>
        <div class="feedback" id="feedback"></div>
        <div class="next-round-wrap">
          <button class="btn next-round" id="nextRoundBtn">⏭️ Наступний раунд</button>
        </div>
      </div>
    </main>

    <div class="animation-overlay" id="animOverlay">
      <div class="anim-stage" id="animStage"></div>
    </div>
  </div>

  <!-- Вітальна модалка (показується при першому запуску) -->
  <div class="welcome-overlay" id="welcomeOverlay" hidden>
    <div class="welcome-card">
      <h2 class="welcome-title" id="welcomeTitle">🎤 ¡Hola, futura caza-demonios! 🗡️</h2>
      <p class="welcome-sub"  id="welcomeSub">Antes de empezar, cuéntanos un poco sobre ti.</p>

      <div class="welcome-section">
        <label class="welcome-label" id="welcomeLangLabel">🌐 Idioma:</label>
        <div class="welcome-flags" id="welcomeFlags">
          <button class="flag" data-lang="es" title="Español"><svg viewBox="0 0 60 40" width="48" height="34"><rect width="60" height="10" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/><rect y="30" width="60" height="10" fill="#aa151b"/></svg></button>
          <button class="flag" data-lang="uk" title="Українська"><svg viewBox="0 0 60 40" width="48" height="34"><rect width="60" height="20" fill="#0057b7"/><rect y="20" width="60" height="20" fill="#ffd700"/></svg></button>
          <button class="flag" data-lang="ru" title="Русский"><svg viewBox="0 0 60 40" width="48" height="34"><rect width="60" height="13.33" fill="#fff"/><rect y="13.33" width="60" height="13.33" fill="#0039a6"/><rect y="26.66" width="60" height="13.34" fill="#d52b1e"/></svg></button>
        </div>
      </div>

      <div class="welcome-section">
        <label class="welcome-label" for="welcomeName" id="welcomeNameLabel">📛 ¿Cómo te llamas?</label>
        <input type="text" id="welcomeName" class="welcome-input" maxlength="20" autocomplete="off" placeholder="..." />
      </div>

      <div class="welcome-section">
        <label class="welcome-label" id="welcomeGenderLabel">🦸 ¿Quién eres?</label>
        <div class="gender-grid" id="genderGrid">
          <button class="gender-btn" data-gender="f">
            <span class="gender-emoji">👧</span>
            <span class="gender-text" data-g-text="f">Niña</span>
          </button>
          <button class="gender-btn" data-gender="m">
            <span class="gender-emoji">👦</span>
            <span class="gender-text" data-g-text="m">Niño</span>
          </button>
          <button class="gender-btn" data-gender="n">
            <span class="gender-emoji">⭐</span>
            <span class="gender-text" data-g-text="n">Prefiero no decir</span>
          </button>
        </div>
      </div>

      <div class="welcome-section">
        <label class="welcome-label" id="welcomeGameLabel">🎮 Juego:</label>
        <div class="gender-grid three-col" id="welcomeGameGrid">
          <!-- Картки ігор рендеряться JS з реєстру window.Games -->
        </div>
      </div>

      <div class="welcome-section">
        <label class="welcome-label" id="welcomeDiffLabel">🎚️ Dificultad:</label>
        <div class="gender-grid" id="welcomeDiffGrid">
          <button class="gender-btn diff-card" data-w-diff="easy">
            <span class="gender-emoji">🌱</span>
            <span class="gender-text" data-w-diff-text="easy">Aprendiz</span>
            <span class="diff-stars" aria-label="1/3"><span class="s on">★</span><span class="s">★</span><span class="s">★</span></span>
          </button>
          <button class="gender-btn diff-card" data-w-diff="medium">
            <span class="gender-emoji">🗡️</span>
            <span class="gender-text" data-w-diff-text="medium">Cazador</span>
            <span class="diff-stars" aria-label="2/3"><span class="s on">★</span><span class="s on">★</span><span class="s">★</span></span>
          </button>
          <button class="gender-btn diff-card" data-w-diff="hard">
            <span class="gender-emoji">👑</span>
            <span class="gender-text" data-w-diff-text="hard">Leyenda</span>
            <span class="diff-stars" aria-label="3/3"><span class="s on">★</span><span class="s on">★</span><span class="s on">★</span></span>
          </button>
        </div>
      </div>

      <div class="welcome-actions">
        <button class="btn welcome-cancel" id="welcomeCancel" hidden>✖️ Cancelar</button>
        <button class="btn welcome-start" id="welcomeStart">🗡️ ¡Empezar entrenamiento!</button>
      </div>
    </div>
  </div>

  <!-- Челендж — батьківський режим: один рівень + цілі по іграх -->
  <div class="welcome-overlay" id="challengeOverlay" hidden>
    <div class="welcome-card challenge-card">
      <h2 class="welcome-title" id="challengeTitle">🏆 Challenge mode</h2>
      <p class="welcome-sub" id="challengeSub">Pick a difficulty and how many rounds per game.</p>

      <div class="welcome-section" id="challengeDiffSection">
        <label class="welcome-label" id="challengeDiffLabel">🎚️ Складність (одна для всіх):</label>
        <div class="gender-grid three-col" id="challengeDiffGrid">
          <button class="gender-btn diff-card" data-c-diff="easy">
            <span class="gender-emoji">🌱</span>
            <span class="gender-text" data-c-diff-text="easy">Easy</span>
            <span class="diff-stars"><span class="s on">★</span><span class="s">★</span><span class="s">★</span></span>
          </button>
          <button class="gender-btn diff-card" data-c-diff="medium">
            <span class="gender-emoji">🗡️</span>
            <span class="gender-text" data-c-diff-text="medium">Medium</span>
            <span class="diff-stars"><span class="s on">★</span><span class="s on">★</span><span class="s">★</span></span>
          </button>
          <button class="gender-btn diff-card" data-c-diff="hard">
            <span class="gender-emoji">👑</span>
            <span class="gender-text" data-c-diff-text="hard">Hard</span>
            <span class="diff-stars"><span class="s on">★</span><span class="s on">★</span><span class="s on">★</span></span>
          </button>
        </div>
      </div>

      <div class="welcome-section">
        <label class="welcome-label" id="challengeGoalsLabel">🎯 Ціль по іграх:</label>
        <div class="challenge-goals" id="challengeGoals"></div>
      </div>

      <div class="welcome-actions">
        <button class="btn welcome-cancel" id="challengeCancel">✖️ Скасувати</button>
        <button class="btn welcome-start" id="challengeStart">🚀 Почати челендж</button>
      </div>
    </div>
  </div>

  <!-- Підсумок челенджу -->
  <div class="welcome-overlay" id="summaryOverlay" hidden>
    <div class="welcome-card summary-card">
      <h2 class="welcome-title">🏆 <span id="summaryTitleText">Challenge complete!</span> 🎉</h2>
      <div class="summary-body" id="summaryBody"></div>
      <div class="welcome-actions">
        <button class="btn welcome-start" id="summaryClose">✅ ОК</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="weights-game.js"></script>
  <script src="volumes-game.js"></script>
  <script src="multiplication-game.js"></script>
  <script src="division-game.js"></script>
</body>
</html>
