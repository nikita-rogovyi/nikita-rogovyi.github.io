<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Repassem el curs</title>
<style>
  :root{
    --bg:#190a24; --card:#33134a; --card2:#3d1659; --accent:#ff2e88; --accent2:#9b62ff;
    --gold:#ffd23f; --good:#34d97b; --bad:#ff4d6d; --ink:#fff4fb; --muted:#cda9e6; --line:#5a2b80;
    --display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Quicksand", system-ui, sans-serif;
    --body: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow-x:hidden;overscroll-behavior:none}
  body{
    background:
      radial-gradient(900px 520px at 18% -8%, rgba(255,46,136,.30), transparent 60%),
      radial-gradient(900px 520px at 86% -4%, rgba(155,98,255,.30), transparent 60%),
      radial-gradient(1100px 900px at 50% 120%, rgba(255,210,63,.10), transparent 55%),
      #190a24;
    color:var(--ink);font-family:var(--body);font-weight:600;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  .app{max-width:1024px;margin:0 auto;min-height:100%;padding:14px 16px 40px;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .logo{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.2px}.logo b{color:var(--accent)}
  .badge{background:#00000033;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:3px 9px;border-radius:999px}
  .spacer{margin-left:auto}
  .langs{display:flex;gap:4px}
  .lang{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
  .lang.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .reportbtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}

  /* HOME */
  .home-title{font-family:var(--display);font-size:26px;font-weight:800;margin:6px 0 2px}
  .home-sub{color:var(--muted);font-size:14px;margin-bottom:12px}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bcard{text-align:left;cursor:pointer;color:var(--ink);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .08s}
  .bcard:active{transform:scale(.98)}
  .bic{font-size:40px}
  .bcard h2{font-family:var(--display);margin:8px 0 4px;font-size:22px}
  .bsub{color:var(--muted);font-size:13px}
  .bprog{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#00000033;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
  .chip.gold{color:var(--gold);border-color:#ffd23f55}
  .chip.pen{color:var(--muted)}
  @media (max-width:560px){ .home-grid{grid-template-columns:1fr} }

  /* MAPA de bloques (estilo Duolingo, solo 4 estaciones) */
  .quest{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 0 28px}
  .quest::before{content:'';position:absolute;top:30px;bottom:60px;left:50%;width:5px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,#ffffff22 0 10px,transparent 10px 20px);border-radius:999px}
  .qblock{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;margin:18px 0;color:var(--ink)}
  .qb-coin{width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;border:4px solid var(--line);background:var(--card2);box-shadow:0 9px 0 rgba(0,0,0,.4);transition:transform .1s, box-shadow .1s}
  .qblock:active .qb-coin{transform:translateY(4px);box-shadow:0 5px 0 rgba(0,0,0,.4)}
  .qblock.perfect .qb-coin{background:linear-gradient(180deg,#5be39b,#26b56a);border-color:#7eedb3;box-shadow:0 9px 0 #0d7a45}
  .qblock.completed .qb-coin{background:linear-gradient(180deg,#ffe488,#ffb02e);border-color:#ffd56b;box-shadow:0 9px 0 #b87600}
  .qblock.current .qb-coin{border-color:var(--accent2);animation:qpulse 1.7s ease-in-out infinite}
  @keyframes qpulse{0%,100%{box-shadow:0 9px 0 rgba(0,0,0,.4),0 0 0 0 rgba(155,98,255,.5)}50%{box-shadow:0 9px 0 rgba(0,0,0,.4),0 0 0 16px rgba(155,98,255,0)}}
  @media (prefers-reduced-motion: reduce){ .qblock.current .qb-coin{animation:none;box-shadow:0 9px 0 rgba(0,0,0,.4),0 0 0 5px var(--accent2)} }
  .qb-name{font-family:var(--display);font-weight:800;font-size:20px}
  .qb-prog{font-size:13px;font-weight:800;color:var(--muted)}
  .qstars.st-full{color:var(--good)}   /* 7/7 → verde */
  .qstars.st-part{color:var(--gold)}   /* 3/7 → amarillo */
  .qpaper{color:var(--muted)}

  .progress{height:14px;background:#10061a;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  .progress>i{display:block;height:100%;border-radius:999px;transition:width .35s cubic-bezier(.2,.9,.3,1.2);background:linear-gradient(90deg,var(--accent),var(--gold));box-shadow:0 0 14px rgba(255,210,63,.55)}

  .ex{position:relative;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:28px;padding:20px 20px 24px;box-shadow:0 18px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
  .ex.celebrate{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
  .exhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px}
  .num{font-family:var(--display);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;border-radius:16px;padding:8px 14px;font-size:20px;flex:none;box-shadow:0 6px 16px rgba(255,46,136,.35)}
  .eyebrow{font-family:var(--display);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--accent2);margin-bottom:3px}
  .title{font-family:var(--display);font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.2px}
  .hint{color:var(--muted);font-size:15px;font-weight:600;margin:6px 0 16px}
  .subcap{font-family:var(--display);color:var(--accent2);font-weight:800;font-size:14px;letter-spacing:.3px;text-transform:uppercase;margin:8px 0 6px}
  /* separador de partes cuando un ejercicio tiene varias (cuaderno + tablet) */
  .steptag{display:block;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;
    background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:12px;padding:9px 15px;margin:10px 0 8px;
    box-shadow:0 6px 14px rgba(0,0,0,.3)}

  /* PAPEL — hoja de cuaderno */
  .paper{position:relative;margin:0 0 16px;padding:30px 18px 18px 56px;border-radius:8px 14px 14px 8px;color:#2a1838;
    background:linear-gradient(90deg, transparent 44px, rgba(255,46,136,.45) 44px, rgba(255,46,136,.45) 46px, transparent 46px),repeating-linear-gradient(#fffdf4, #fffdf4 33px, #cfe3f5 34px),#fffdf4;
    box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.05)}
  .pbadge{position:absolute;top:-12px;left:18px;background:var(--gold);color:#3a2a05;font-family:var(--display);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:5px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(-2deg)}
  .pnum{color:#c01563}
  .ptext{color:#231030}
  .pintro{font-family:var(--display);font-weight:800;font-size:19px;line-height:32px;margin-bottom:2px}
  .pline{font-family:var(--display);font-weight:700;font-size:23px;line-height:34px}
  .psub{font-family:var(--display);font-weight:800;font-size:16px;color:#c01563;line-height:34px;margin-top:4px}

  /* dictado */
  .dictbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .dict-text{margin:12px auto 0;max-width:600px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px;color:#231030;background:#fffdf4;border:2px dashed var(--accent2);border-radius:14px;padding:14px 16px}
  .dict-text .lbl{display:block;font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:#c01563;margin-bottom:6px}

  /* campos numéricos */
  .frow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:25px;font-weight:800;margin:14px 0;justify-content:center}
  .ftxt{white-space:pre}
  input.nf{width:92px;height:60px;text-align:center;border:2px solid var(--line);border-radius:13px;background:#00000033;color:var(--ink);font-size:26px;font-weight:800;-webkit-user-select:text;user-select:text}
  input.nf:focus{outline:none;border-color:var(--accent);background:#ff2e8818}
  /* lista alineada (ej. 1º «Cien = ___»): etiquetas a la derecha, casillas en columna */
  .numlist{width:fit-content;max-width:100%;margin:2px auto 0}
  .numlist .frow{justify-content:flex-start;font-size:22px}
  .numlist .ftxt{min-width:15em;text-align:right}

  /* signos — cada comparación en su propia zona */
  .signrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0;border-radius:16px;padding:10px 14px;background:#00000026;border:1px solid var(--line)}
  .signnum{font-size:30px;font-weight:800;min-width:78px;text-align:center}
  .signbtns{display:flex;gap:8px}
  .sbtn{width:60px;height:60px;border-radius:16px;font-size:30px;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .sbtn.sel{border-color:var(--accent);background:#ff2e8822}

  /* elegir artículo */
  .chrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0;border-radius:14px;padding:6px}
  .chopts{display:flex;gap:6px}
  .chbtn{min-width:58px;height:50px;border-radius:14px;font-size:20px;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .chbtn.sel{border-color:var(--accent);background:#ff2e8822}
  .chnoun{font-size:25px;font-weight:800;min-width:130px;text-align:left}

  /* sílabas */
  .sylrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0;border-radius:14px;padding:6px}
  .syl-l{font-size:32px;font-weight:800}
  .syl-gap{width:20px;height:42px;border:none;background:transparent;cursor:pointer;position:relative}
  .syl-gap::after{content:'·';color:#ffffff44;font-size:24px;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%)}
  .syl-gap.cut::after{content:'';width:5px;height:34px;border-radius:999px;background:linear-gradient(180deg,var(--gold),var(--accent));box-shadow:0 0 10px var(--gold)}

  /* compuestas */
  .pairwrap{display:flex;gap:30px;justify-content:center;margin:8px 0}
  .pcol2{display:flex;flex-direction:column;gap:10px}
  .pchip{min-width:130px;border:2px solid var(--line);color:var(--ink);background:var(--card);border-radius:14px;padding:14px 16px;font-size:20px;font-weight:800;cursor:pointer}
  .pchip.sel{border-color:var(--accent);background:#ff2e8822;transform:scale(1.04)}
  .pchip.done{border-color:var(--good);background:#34d97b18;color:var(--good)}
  .formed{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;min-height:30px}
  .fword{font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold)}

  /* ordenar — arrastrar */
  .orow{display:flex;gap:10px;flex-wrap:nowrap;justify-content:center;align-items:center;margin:14px 0;overflow-x:auto;padding:6px 2px}
  .ochip{flex:none;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:16px;padding:14px 18px;font-size:23px;font-weight:800;cursor:grab;touch-action:none;transition:transform .12s, box-shadow .12s}
  .ochip.dragging{opacity:.3;cursor:grabbing;border-style:dashed}
  /* cada frase a ordenar en su propia zona (10º Castellano) */
  .ordertask{background:#00000026;border:1px solid var(--line);border-radius:16px;padding:6px 10px 10px;margin:16px 0}
  .ordertask-lab{font-family:var(--display);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent2);margin:4px 0 0 4px}
  .ordertask .orow{margin:6px 0 2px}
  .dragghost{position:fixed;left:0;top:0;margin:0;pointer-events:none;z-index:9999;box-shadow:0 14px 30px rgba(0,0,0,.5);border-color:var(--accent)!important;cursor:grabbing}
  .dropbar{flex:none;align-self:stretch;width:6px;min-height:54px;border-radius:999px;pointer-events:none;background:linear-gradient(180deg,var(--gold),var(--accent));box-shadow:0 0 14px var(--gold);animation:barpulse .7s ease-in-out infinite}
  @keyframes barpulse{0%,100%{opacity:.55;transform:scaleY(.9)}50%{opacity:1;transform:scaleY(1)}}

  /* ábaco */
  .abaci{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .abcard{background:#00000026;border:1px solid var(--line);border-radius:16px;padding:12px}
  .abnum{text-align:center;font-size:24px;font-weight:800;margin-bottom:8px;color:var(--accent)}
  .abrods{display:flex;gap:12px}
  .abrod{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;width:60px}
  .ablabel{order:-1;margin-top:6px;font-family:var(--display);font-weight:800;font-size:18px}
  .abead{width:48px;height:19px;border-radius:50%;background:#4d3a6e;border:2px solid #9b78c9;cursor:pointer}
  .abrod[data-rk="C"] .ablabel{color:#ff7ab6} .abrod[data-rk="D"] .ablabel{color:#b79bff} .abrod[data-rk="U"] .ablabel{color:#ffd23f}
  .abrod[data-rk="C"] .abead.on{background:linear-gradient(180deg,#ff8ec2,#ff2e88);border-color:#ff9ecb}
  .abrod[data-rk="D"] .abead.on{background:linear-gradient(180deg,#c3b0ff,#7b3cff);border-color:#cdbcff}
  .abrod[data-rk="U"] .abead.on{background:linear-gradient(180deg,#ffe488,#ffb02e);border-color:#ffd56b}

  /* reloj */
  .clocks{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .clockcard{text-align:center;border-radius:14px;padding:6px}
  .clocklabel{font-size:16px;font-weight:700;margin-bottom:4px}
  svg.clk{width:208px;height:208px;touch-action:none}
  .cface{fill:#241433;stroke:#3d2456;stroke-width:4}
  .hh{stroke:#ffd24d;stroke-width:11;stroke-linecap:round} .mh{stroke:#ff2e88;stroke-width:5;stroke-linecap:round}
  .cpin{fill:#fff} .ctick{stroke:#7b5cff;stroke-width:2}
  .cnum{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:16px;text-anchor:middle;dominant-baseline:central}
  .clk-legend{text-align:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--muted);margin:0 0 10px}
  .clk-legend .lg-h{color:#ffd24d;font-size:18px} .clk-legend .lg-m{color:var(--accent);font-size:18px}

  /* cubos / formas */
  .pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:54px;margin:6px 0 14px;padding:8px;border:1px dashed var(--line);border-radius:14px}
  .buckets{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .bucket{flex:1;min-width:240px;background:#00000026;border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
  .bktitle{font-weight:800;text-align:center;margin-bottom:8px;color:var(--accent2)}
  .bkitems{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px}
  .bchip{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:13px;padding:12px 16px;font-size:18px;font-weight:700;cursor:grab;touch-action:none}
  .bchip.dragging{opacity:.5}
  .bucket.drop{border-color:var(--accent);background:#ff2e8818}

  .wrong{animation:shake .5s ease;border-color:var(--bad)!important;box-shadow:0 0 0 4px rgba(255,77,109,.5)!important}
  @keyframes shake{0%,100%{transform:translateX(0)}15%,55%{transform:translateX(-7px)}35%,75%{transform:translateX(7px)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){ .wrong{animation:none} .ex.celebrate{animation:none} .progress>i{transition:none} .dropbar{animation:none} }

  .fb{min-height:32px;text-align:center;font-family:var(--display);font-size:21px;font-weight:800;margin:16px 0 4px}
  .fb.ok{color:var(--gold)} .fb.bad{color:var(--bad)}

  .nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
  .btn{font-family:var(--display);border:none;border-radius:18px;padding:15px 22px;font-size:18px;font-weight:800;cursor:pointer;transition:transform .08s}
  .btn:active{transform:translateY(2px)} .btn:disabled{opacity:.3}
  .btn.ghost{background:#ffffff12;color:var(--ink);border:1px solid var(--line)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(255,46,136,.4)}
  .btn.check{background:linear-gradient(135deg,var(--gold),#ffb02e);color:#3a2a05;box-shadow:0 8px 18px rgba(255,178,46,.35)}

  .summary{font-family:var(--display);font-size:18px;font-weight:700;text-align:center;margin:6px 0 14px;line-height:1.6}
  .summary b{color:var(--gold);font-size:26px}
  .repsec{font-family:var(--display);margin:16px 0 6px;font-weight:800;color:var(--accent2);text-transform:uppercase;font-size:13px;letter-spacing:.3px}
  ul.report{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.report li{display:flex;align-items:center;gap:10px;background:#00000026;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
  ul.report .rn{font-weight:800;color:var(--accent);width:38px;flex:none}
  ul.report .rs{margin-left:auto;font-size:18px;flex:none;padding-left:8px}
  ul.report li.prow{align-items:flex-start}
  .pcol{flex:1;min-width:0} .pprompt{font-weight:700;font-size:18px}
  .pkey{margin-top:6px;font-size:18px;font-weight:700;color:var(--good);background:#34d97b1f;border:1px solid #34d97b55;border-radius:10px;padding:9px 12px;line-height:1.65}
  .pkey b{color:var(--ink);font-weight:800}
  .ptoggle{margin-left:auto;display:flex;gap:6px;flex:none}
  .ptbtn{border:1px solid var(--line);background:#00000033;color:var(--muted);border-radius:10px;padding:6px 12px;font-size:16px;cursor:pointer}
  .ptbtn.ok{border-color:var(--good);color:var(--good);background:#34d97b18}
  .ptbtn.no{border-color:var(--bad);color:var(--bad);background:#ff4d6d18}
  /* modal de instrucción (tareas en el cuaderno) */
  .modal-overlay{position:fixed;inset:0;z-index:9998;background:rgba(10,4,16,.72);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal{max-width:460px;width:100%;text-align:center;background:linear-gradient(165deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:26px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .mh-ic{font-size:52px;line-height:1}
  .modal h2{font-family:var(--display);font-size:23px;margin:10px 0 6px}
  .modal p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 14px}
  .mh-eg{font-family:var(--display);font-weight:800;font-size:14px;color:var(--accent2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
  .he-box{text-align:left;color:#231030;border-radius:10px;padding:12px 14px 12px 40px;
    background:linear-gradient(90deg, transparent 28px, rgba(255,46,136,.4) 28px, rgba(255,46,136,.4) 30px, transparent 30px),repeating-linear-gradient(#fffdf4,#fffdf4 29px,#cfe3f5 30px),#fffdf4}
  .he-line{font-family:var(--display);font-weight:700;font-size:19px;line-height:30px}
  .mh-check{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer}
  .mh-check input{width:20px;height:20px;accent-color:var(--accent)}
  .draft-eg{display:inline-block;white-space:pre;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-weight:700;font-size:20px;line-height:1.35;color:#231030;background:#fffdf4;border:2px dashed var(--accent2);border-radius:12px;padding:12px 20px}
  .dh-only{color:var(--good);font-weight:800;font-family:var(--display);margin:12px 0 0}

  /* === legibilidad: texto más grande y adaptable a la pantalla (tablet) === */

/* arrastrar (puntero) */
function startDrag(el, e, opts){
  e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){}
  const r0=el.getBoundingClientRect(), off={x:e.clientX-r0.left, y:e.clientY-r0.top};
  let started=false, ghost=null;
  const onMove=ev=>{
    if(!started){ started=true; el.classList.add('dragging');
      if(opts.ghost){ ghost=el.cloneNode(true); ghost.className=el.className.replace('dragging','')+' dragghost';
        ghost.style.width=r0.width+'px'; ghost.style.height=r0.height+'px'; document.body.appendChild(ghost); } }
    if(ghost) ghost.style.transform='translate('+(ev.clientX-off.x)+'px,'+(ev.clientY-off.y)+'px)';
    if(opts.onMove) opts.onMove(ev);
  };
  const onUp=ev=>{
    el.removeEventListener('pointermove',onMove); el.removeEventListener('pointerup',onUp); el.removeEventListener('pointercancel',onUp);
    if(ghost) ghost.remove(); if(started && opts.onDrop) opts.onDrop(ev); el.classList.remove('dragging');
  };
  el.addEventListener('pointermove',onMove); el.addEventListener('pointerup',onUp); el.addEventListener('pointercancel',onUp);
}

/* ===== widgets ===== */
function tok(s){ return {txt:s}; }
function nf(ans,max){ return {nf:String(ans),max:max||5}; }
function wFields(root, rows, opts){
  opts=opts||{};
  root.innerHTML = rows.map(row=>`<div class="frow">`+row.map(x=>
    x.nf!==undefined ? `<input class="nf" inputmode="numeric" pattern="[0-9]*" maxlength="${x.max}" data-ans="${x.nf}">`
                     : `<span class="ftxt">${x.txt}</span>`).join('')+`</div>`).join('');
  const ins=()=>[...root.querySelectorAll('.nf')];
  const val=n=>n.value.trim();   // ignorar espacios / saltos de línea
  // emptyZero: campo vacío cuenta como 0 (ej. centenas/decenas que valen 0)
  const norm=n=> (val(n)==='' && opts.emptyZero) ? '0' : val(n);
  // comparación numérica: «00» = 0, «07» = 7 (ceros a la izquierda)
  const ok=n=>norm(n)!=='' && /^[0-9]+$/.test(norm(n)) && Number(norm(n))===Number(n.dataset.ans);
  return { check:()=>ins().every(ok), mark:()=>ins().forEach(n=>{ if(!ok(n)) flash(n); }) };
}
function wSigns(root, rows){
  root.innerHTML = rows.map((r,ix)=>`<div class="signrow"><span class="signnum">${r.a}</span><span class="signbtns">`+
    `<button class="sbtn" data-r="${ix}" data-v="gt">&gt;</button><button class="sbtn" data-r="${ix}" data-v="lt">&lt;</button><button class="sbtn" data-r="${ix}" data-v="eq">=</button>`+
    `</span><span class="signnum">${r.b}</span></div>`).join('');
  const sel={}, rowEls=[...root.querySelectorAll('.signrow')];
  root.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>{ root.querySelectorAll('.sbtn[data-r="'+b.dataset.r+'"]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel[b.dataset.r]=b.dataset.v; });
  return { check:()=>rows.every((r,ix)=>sel[ix]===r.ans), mark:()=>rows.forEach((r,ix)=>{ if(sel[ix]!==r.ans) flash(rowEls[ix]); }) };
}
function wChoose(root, rows, options){
  root.innerHTML = rows.map((r,ix)=>`<div class="chrow"><span class="chopts">`+
    options.map(o=>`<button class="chbtn" data-r="${ix}" data-v="${o}">${o}</button>`).join('')+`</span><span class="chnoun">${r.noun}</span></div>`).join('');
  const sel={}, rowEls=[...root.querySelectorAll('.chrow')];
  root.querySelectorAll('.chbtn').forEach(b=>b.onclick=()=>{ root.querySelectorAll('.chbtn[data-r="'+b.dataset.r+'"]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel[b.dataset.r]=b.dataset.v; });
  return { check:()=>rows.every((r,ix)=>sel[ix]===r.ans), mark:()=>rows.forEach((r,ix)=>{ if(sel[ix]!==r.ans) flash(rowEls[ix]); }) };
}
function wSyll(root, words){
  root.innerHTML = words.map((wd)=>{ const L=wd.w.split(''); let h='<div class="sylrow">';
    L.forEach((ch,li)=>{ h+='<span class="syl-l">'+ch+'</span>'; if(li<L.length-1) h+='<button class="syl-gap" data-gi="'+li+'"></button>'; });
    return h+'</div>'; }).join('');
  const rowEls=[...root.querySelectorAll('.sylrow')], st=words.map(()=>new Set());
  rowEls.forEach((row,wi)=>row.querySelectorAll('.syl-gap').forEach(g=>g.onclick=()=>{ const gi=+g.dataset.gi;
    if(st[wi].has(gi)){ st[wi].delete(gi); g.classList.remove('cut'); } else { st[wi].add(gi); g.classList.add('cut'); } }));
  const eq=(s,a)=>s.size===a.length && a.every(x=>s.has(x));
  return { check:()=>words.every((wd,wi)=>eq(st[wi],wd.cuts)), mark:()=>words.forEach((wd,wi)=>{ if(!eq(st[wi],wd.cuts)) flash(rowEls[wi]); }) };
}
function wPairs(root, pairs){
  const lefts=pairs.map(p=>p.l), rights=shuffle(pairs.map(p=>p.r)), match={}; let sel=null;
  const usedBy=r=>Object.keys(match).find(l=>match[l]===r);
  const draw=()=>{ root.innerHTML='<div class="pairwrap"><div class="pcol2">'+
      lefts.map(l=>`<button class="pchip left${sel===l?' sel':''}${match[l]?' done':''}" data-l="${l}">${l}</button>`).join('')+
      '</div><div class="pcol2">'+rights.map(r=>`<button class="pchip right${usedBy(r)?' done':''}" data-r="${r}">${r}</button>`).join('')+
      '</div></div><div class="formed">'+lefts.filter(l=>match[l]).map(l=>`<span class="fword">${l}${match[l]}</span>`).join('')+'</div>';

function buildOrderRow(items, correct){
  const row=document.createElement('div'); row.className='orow';
  shuffle(items).forEach(v=>{ const b=document.createElement('button'); b.className='ochip'; b.dataset.v=v; b.textContent=v; row.appendChild(b); });
  const target=x=>Array.from(row.querySelectorAll('.ochip:not(.dragging)')).find(el=>{ const b=el.getBoundingClientRect(); return x<b.left+b.width/2; })||null;
  let bar=null;
  const showBar=x=>{ if(!bar){ bar=document.createElement('div'); bar.className='dropbar'; } bar.remove(); const ref=target(x); if(ref) row.insertBefore(bar,ref); else row.appendChild(bar); };
  const place=(c,x)=>{ const ref=target(x); if(bar){ bar.remove(); bar=null; } if(ref) row.insertBefore(c,ref); else row.appendChild(c); };
  row.querySelectorAll('.ochip').forEach(c=>c.addEventListener('pointerdown',e=>startDrag(c,e,{ ghost:true, onMove:ev=>showBar(ev.clientX), onDrop:ev=>place(c,ev.clientX) })));
  const cur=()=>[...row.querySelectorAll('.ochip')].map(c=>c.dataset.v);
  // correct puede ser un orden único o varios órdenes válidos (p.ej. «tomates y manzanas» = «manzanas y tomates»)
  const accepted=(Array.isArray(correct[0])?correct:[correct]).map(a=>a.map(String).join('|'));
  const isOk=()=>accepted.includes(cur().join('|'));
  return { el:row, check:isOk, mark:()=>{ if(!isOk()) row.querySelectorAll('.ochip').forEach(c=>flash(c)); } };
}
function wOrder(root, items, correct){ const r=buildOrderRow(items.map(String), correct.map(String)); root.appendChild(r.el); return { check:r.check, mark:r.mark }; }
function wOrderWords(root, sentences){ const rows=sentences.map(s=>buildOrderRow(s.words, s.correct));

function wAbacus(root, targets){
  const st=targets.map(()=>({C:0,D:0,U:0}));
  root.innerHTML='<div class="abaci">'+targets.map((tg,ix)=>`<div class="abcard"><div class="abnum">${tg}</div><div class="abrods" data-ix="${ix}">`+
    ['C','D','U'].map(rk=>`<div class="abrod" data-rk="${rk}"><div class="ablabel">${rk}</div>`+Array.from({length:9},(_,bi)=>`<div class="abead" data-bi="${bi}"></div>`).join('')+`</div>`).join('')+
    `</div></div>`).join('')+'</div>';

      rod.querySelectorAll('.abead').forEach(b=>b.onclick=()=>{ const bi=+b.dataset.bi; st[ix][rk]= bi<st[ix][rk]?bi:bi+1; redraw(); }); }); });

function genTicks(){ let s=''; for(let i=0;i<12;i++){const a=i*30*Math.PI/180; s+=`<line class="ctick" x1="${100+82*Math.sin(a)}" y1="${100-82*Math.cos(a)}" x2="${100+90*Math.sin(a)}" y2="${100-90*Math.cos(a)}"/>`;} return s; }
function genNums(){ let s=''; for(let i=1;i<=12;i++){const a=i*30*Math.PI/180; s+=`<text class="cnum" x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)}">${i}</text>`;} return s; }
function wClock(root, items){
  root.innerHTML='<div class="clk-legend"><span class="lg-h">●</span> '+t('clk_hours')+' · <span class="lg-m">●</span> '+t('clk_min')+'</div>'+
    '<div class="clocks">'+items.map((it,ix)=>`<div class="clockcard"><div class="clocklabel">${it.label}</div>`+
    `<svg class="clk" data-ix="${ix}" viewBox="0 0 200 200"><circle class="cface" cx="100" cy="100" r="92"/>${genTicks()}${genNums()}`+
    `<line class="hh" x1="100" y1="100" x2="100" y2="62"/><line class="mh" x1="100" y1="100" x2="100" y2="20"/><circle class="cpin" cx="100" cy="100" r="6"/></svg></div>`).join('')+'</div>';
  const st=items.map(()=>({h:0,m:0})), cards=[...root.querySelectorAll('.clockcard')];
  const setHand=(svg,cls,len,ang)=>{ const r=ang*Math.PI/180, l=svg.querySelector(cls); l.setAttribute('x2',100+len*Math.sin(r)); l.setAttribute('y2',100-len*Math.cos(r)); };
  root.querySelectorAll('.clk').forEach(svg=>{ const ix=+svg.dataset.ix; let drag=null;
    const angAt=e=>{ const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*200, py=(e.clientY-r.top)/r.height*200; return (Math.atan2(px-100,-(py-100))*180/Math.PI+360)%360; };
    const cd=(a,b)=>{ let d=Math.abs(a-b)%360; return Math.min(d,360-d); };
    const draw=()=>{ setHand(svg,'.mh',82,st[ix].m); setHand(svg,'.hh',38,st[ix].h); };
    const move=e=>{ const a=angAt(e); if(drag==='m')st[ix].m=a; else st[ix].h=a; draw(); };
    svg.addEventListener('pointerdown',e=>{ e.preventDefault(); try{svg.setPointerCapture(e.pointerId);}catch(_){} const a=angAt(e); drag=cd(a,st[ix].m)<=cd(a,st[ix].h)?'m':'h'; move(e); });
    svg.addEventListener('pointermove',e=>{ if(drag)move(e); });
    svg.addEventListener('pointerup',()=>{ if(drag==='m') st[ix].m=(Math.round(st[ix].m/30)*30)%360; draw(); drag=null; });
    draw(); });
  const okClock=ix=>{ const m=(Math.round(st[ix].m/30)*5)%60, hf=st[ix].h/30, exp=(items[ix].h%12)+items[ix].m/60; let d=Math.abs(hf-exp); d=Math.min(d,12-d); return m===items[ix].m && d<0.6; };
  return { check:()=>items.every((_,ix)=>okClock(ix)), mark:()=>items.forEach((_,ix)=>{ if(!okClock(ix)) flash(cards[ix]); }) };
}
function wBuckets(root, buckets){
  const items=shuffle(buckets.flatMap(b=>b.accepts)), placed={}; items.forEach(i=>placed[i]=null);
  const chip=it=>`<button class="bchip" data-it="${it}">${it}</button>`;
  const clearDrop=()=>root.querySelectorAll('.bucket').forEach(b=>b.classList.remove('drop'));
  const draw=()=>{ root.innerHTML=`<div class="pool">`+items.filter(i=>placed[i]===null).map(chip).join('')+`</div>`+
      `<div class="buckets">`+buckets.map((b,bi)=>`<div class="bucket" data-bi="${bi}"><div class="bktitle">${b.name}</div><div class="bkitems">`+items.filter(i=>placed[i]===bi).map(chip).join('')+`</div></div>`).join('')+`</div>`;
    root.querySelectorAll('.bchip').forEach(c=>c.addEventListener('pointerdown',e=>startDrag(c,e,{ ghost:true,
      onMove:ev=>{ clearDrop(); const tt=document.elementFromPoint(ev.clientX,ev.clientY), bk=tt&&tt.closest('.bucket'); if(bk)bk.classList.add('drop'); },
      onDrop:ev=>{ clearDrop(); const tt=document.elementFromPoint(ev.clientX,ev.clientY), it=c.dataset.it, bk=tt&&tt.closest('.bucket'), pl=tt&&tt.closest('.pool');
        if(bk) placed[it]=+bk.dataset.bi; else if(pl) placed[it]=null; draw(); } }))); };
  draw();
  const okItem=i=>placed[i]!==null && buckets[placed[i]].accepts.includes(i);
  return { check:()=>items.every(okItem), mark:()=>items.forEach(i=>{ if(!okItem(i)) flash(root.querySelector('.bchip[data-it="'+i+'"]')); }) };
}

function showHome(){ curBlock=null; show('homeview');
  const wave=[0,52,0,-52]; let html='';
  BLOCKS.forEach((b,gi)=>{ const S=blockState(b.id), EX=b.exercises;
    const autoT=EX.filter(e=>e.build).length, paperT=EX.filter(e=>e.paper).length;
    const first=S.results.filter(r=>r.status==='first').length;
    const paperOk=EX.map((e,k)=>e.paper&&S.paper[k]==='ok').filter(Boolean).length;
    const completed = isCompleted(b.id);
    const perfect = completed && first===autoT;
    const cls = perfect?'perfect':(completed?'completed':'');
    const sc = (autoT>0 && first===autoT) ? 'st-full' : (first>0 ? 'st-part' : '');
    let prog=(perfect?'🏆 ':(completed?'✓ ':''))+`<span class="qstars ${sc}">⭐ ${first}/${autoT}</span>`;
    if(paperT) prog+=` · <span class="qpaper">✍️ ${paperOk}/${paperT}</span>`;
    html+=`<button class="qblock ${cls}" style="left:${wave[gi%4]}px" data-b="${b.id}" data-done="${completed?1:0}">`+
      `<span class="qb-coin">${b.icon}</span><span class="qb-name">${b.name}</span><span class="qb-prog">${prog}</span></button>`; });

  $('exblk').textContent=blk.icon+' '+blk.name;
  $('exn').textContent=ex.n; $('extitle').textContent=ex.title; $('exhint').textContent=t(ex.hint);
  const pb=$('paper');
  if(ex.paper || ex.lines){ pb.classList.remove('hidden'); $('ppnum').textContent=ex.n;
    let h=''; if(ex.paper) h+='<div class="pintro">'+ex.paper+'</div>';
    if(ex.lines) h+=ex.lines.map(l=> (typeof l==='object') ? '<div class="psub">'+l.h+'</div>' : '<div class="pline">'+l+'</div>').join('');
    $('pptext').innerHTML=h; }
  else pb.classList.add('hidden');
  // ejercicio con dos partes (cuaderno + tablet): marcar pasos para no saltarse la primera
  const multi = !!((ex.paper||ex.lines) && ex.build);
  $('step1').classList.toggle('hidden', !multi); $('step2').classList.toggle('hidden', !multi);
  if(multi){ $('step1').textContent=t('step1'); $('step2').textContent=t('step2'); }
  const stage=$('stage'); stage.innerHTML='';
  current = ex.build ? ex.build(stage) : null;
  if(ex.extra) ex.extra(stage);
  const fb=$('fb'), r=S.results[S.i];
  if(current && r.status!=='pending'){ fb.textContent=t('solved'); fb.className='fb ok'; } else { fb.textContent=''; fb.className='fb'; }
  $('bar').style.width=((S.i+1)/EX.length*100)+'%';
  $('prev').disabled = S.i===0;
  const last = S.i===EX.length-1;
  $('next').textContent = (current && r.status==='pending') ? t('check')+(last?' 🏁':' ›') : (last?'🏁':'Siguiente ›');
}
function advance(){ const S=blockState(curBlock), EX=BLOCKS.find(b=>b.id===curBlock).exercises, ni=S.i+1;
  if(ni>=EX.length){ showReport(); return; } S.i=ni; saveDB(); render(); }
/* el botón » valida y avanza: correcto → sigue; incorrecto → resalta y se queda */
function onNext(){
  const S=blockState(curBlock), r=S.results[S.i];
  if(current && r.status==='pending'){
    if(current.check()){ r.status = r.attempts===0?'first':'retry'; saveDB(); beep(true); advance(); }
    else { r.attempts++; saveDB(); const fb=$('fb'); fb.textContent=t('bad'); fb.className='fb bad'; beep(false); current.mark(); }
  } else advance();
}
function go(d){ const S=blockState(curBlock), ni=S.i+d; if(ni<0)return; S.i=ni; saveDB(); render(); }

function showReport(){
  show('repview');
  const blk=BLOCKS.find(b=>b.id===curBlock), EX=blk.exercises, S=blockState(curBlock);
  $('reptitle').textContent=blk.name;
  const autoIdx=EX.map((e,k)=>e.build?k:-1).filter(k=>k>=0);
  const paperIdx=EX.map((e,k)=>e.paper?k:-1).filter(k=>k>=0);
  const first=autoIdx.filter(k=>S.results[k].status==='first').length;
  const paperOk=paperIdx.filter(k=>S.paper[k]==='ok').length, paperPend=paperIdx.filter(k=>!S.paper[k]).length;
  let sum=`<b>${first}</b> / ${autoIdx.length} — ${t('firstline')}`;
  if(paperIdx.length) sum+=`<br>✍️ ${t('secPaper')}: ${paperOk} ✅ · ${paperPend} ${t('porrevisar')}`;
  $('repsum').innerHTML=sum;
  const lbl=s=> s==='first'?t('st_first'): s==='retry'?t('st_retry'): t('st_pending');
  $('secAutoH').classList.toggle('hidden', !autoIdx.length);
  $('replistAuto').innerHTML = autoIdx.map(k=>`<li><span class="rn">${EX[k].n}</span><span>${EX[k].rep||EX[k].title}</span><span class="rs">${lbl(S.results[k].status)}</span></li>`).join('');
  $('secPaperH').classList.toggle('hidden', !paperIdx.length);
  $('replistPaper').innerHTML = paperIdx.map(k=>
    `<li class="prow"><span class="rn">${EX[k].n}</span><div class="pcol"><div class="pprompt">${EX[k].paper}</div>`+
    (EX[k].paperKey?`<div class="pkey"><b>${t('answerKey')}:</b> ${EX[k].paperKey}</div>`:``)+`</div>`+
    `<span class="ptoggle"><button class="ptbtn${S.paper[k]==='ok'?' ok':''}" data-ok="${k}">✅</button><button class="ptbtn${S.paper[k]==='no'?' no':''}" data-no="${k}">❌</button></span></li>`).join('');
  $('replistPaper').querySelectorAll('.ptbtn[data-ok]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.ok; S.paper[k]=S.paper[k]==='ok'?null:'ok'; saveDB(); showReport(); });
  $('replistPaper').querySelectorAll('.ptbtn[data-no]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.no; S.paper[k]=S.paper[k]==='no'?null:'no'; saveDB(); showReport(); });
}

let AC=null;
function beep(ok){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  (ok?[660,880]:[200]).forEach((f,k)=>{ const o=AC.createOscillator(),g=AC.createGain(); o.connect(g);g.connect(AC.destination);
    o.type=ok?'sine':'square'; o.frequency.value=f; const t0=AC.currentTime+k*0.12;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18); o.start(t0); o.stop(t0+0.2); }); }catch(e){} }

function applyLang(){ document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  document.querySelectorAll('[data-ui]').forEach(el=>el.textContent=t(el.dataset.ui)); store.setItem('rep_lang',lang);
  if(!$('repview').classList.contains('hidden')) showReport(); else if(!$('exview').classList.contains('hidden')) render(); else showHome(); }

$('next').onclick=onNext;
$('prev').onclick=()=>go(-1);
$('skipbtn').onclick=advance;  // TEMP: saltar sin resolver (previsualización)
// «‹» contextual: dentro de un bloque → al mapa; en el mapa → al inicio (lanzador)
$('backbtn').onclick=()=>{ if(curBlock) showHome(); else location.assign('index.html'); };
$('backhome').onclick=showHome;
function closeHint(modalId, flag, checkboxId){ if($(checkboxId).checked){ DB[flag]=true; saveDB(); } $(modalId).classList.add('hidden'); const cb=pendingAfterHint; pendingAfterHint=null; if(cb) cb(); }
$('phOk').onclick=()=>closeHint('paperHint','noPaperHint','phDont');
$('dhOk').onclick=()=>closeHint('draftHint','noDraftHint','dhDont');
function restartBlock(){ const blk=BLOCKS.find(b=>b.id===curBlock);
  DB.blocks[curBlock]={ results:blk.exercises.map(()=>({status:'pending',attempts:0})), paper:blk.exercises.map(()=>null), seen:blk.exercises.map(()=>false), i:0 };
  if(curBlock==='castellano'){ DB.dict=Math.floor(Math.random()*DICTADOS.length); }
  saveDB(); render(); }
function confirmRestart(){ if(confirm(t('restartConfirm'))) restartBlock(); }
function resetAll(){ DB={dict:null, blocks:{}}; saveDB(); showHome(); }
function confirmResetAll(){ if(confirm(t('resetAllConfirm'))) resetAll(); }
$('reset').onclick=confirmRestart;        // en el informe: repetir este bloque
$('restartbtn').onclick=confirmResetAll;  // en el mapa: reset general del progreso
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; applyLang(); });

showHome(); applyLang();
</script>
